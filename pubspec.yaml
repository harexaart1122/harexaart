name: harexaart
description: "HarexaArt Realtime Admin, Keeper and Monitoring System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  image_picker: 1.1.2

  # PDF generation
  pdf: ^3.10.8

  # PDF preview / print / download support
  printing: ^5.13.1

  # PDF text extraction for intelligent receipt search
  syncfusion_flutter_pdf: ^28.2.9
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true